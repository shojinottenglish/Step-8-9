      { type: 'sort', q: 'Ben is a kind and generous man. He still ( most / touch / keeps / with / in ) of his old friends.', words: ['most', 'touch', 'keeps', 'with', 'in'], a: ['keeps', 'in', 'touch', 'with', 'most'] }
    ];

    // === グローバルステート ===
    let gameState = 'title'; // 'title', 'playing', 'stageClear', 'milestone', 'gameover'
    let questionQueue = [];
    let currentQIndex = 0;
    
    let totalCorrect = 0;
    let stageCorrect = 0;
    let score = 0;
    let combo = 0;
    let hensachi = 25;
    let playerHp = 3;
    
    let enemyMaxHp = 10;
    let enemyHp = 10;
    
    let timeLeft = 10.0;
    let isAnswering = false;
    let selectedAnswer = null;
    let isCorrect = null;
    
    let selectedWords = [];
    let availableWords = [];
    
    let damageAnim = false;
    let shakeAnim = false;
    
    let timerRef = null;

    // === ユーティリティ ===
    function shuffleArray(array) {
      const newArr = [...array];
      for (let i = newArr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
      }
      return newArr;
    }

    function getHensachiMessage() {
      if (hensachi < 35) return "基礎からしっかり固めよう！";
      if (hensachi < 45) return "良い調子だ！実力がついてきた！";
      if (hensachi < 55) return "中堅校が見えてきた！油断するな！";
      if (hensachi < 65) return "難関大レベル到達！壁を越えろ！";
      if (hensachi < 75) return "圧倒的実力！目指せ頂点！";
      return "君は英語の神だ！";
    }

    function getEnemyInfo() {
      if (hensachi < 35) return { icon: '📝', name: '基礎の小鬼' };
      if (hensachi < 45) return { icon: '📚', name: '単語帳ゴーレム' };
      if (hensachi < 55) return { icon: '🧐', name: '文法の魔人' };
      if (hensachi < 65) return { icon: '🐉', name: '長文ドラゴン' };
      return { icon: '👑', name: '大魔王・入試' };
    }

    function generateConfetti() {
      let html = '<div class="fixed inset-0 pointer-events-none overflow-hidden z-50">';
      const colors = ['#facc15', '#ef4444', '#3b82f6', '#10b981', '#a855f7'];
      for (let i = 0; i < 50; i++) {
        const left = Math.random() * 100;
        const color = colors[Math.floor(Math.random() * colors.length)];
        const dur = 2 + Math.random() * 3;
        const del = Math.random() * 2;
        const rot = Math.random() * 360;
        html += `<div class="absolute w-3 h-3 bg-yellow-400" style="left: ${left}vw; top: -20px; background-color: ${color}; animation: fall ${dur}s linear infinite; animation-delay: ${del}s; transform: rotate(${rot}deg)"></div>`;
      }
      html += '</div>';
      return html;
    }

    // === ゲームロジック ===
    function setGameState(newState) {
      gameState = newState;
      renderApp();
    }

    function initGame() {
      questionQueue = shuffleArray(ALL_QUESTIONS);
      currentQIndex = 0;
      totalCorrect = 0;
      stageCorrect = 0;
      score = 0;
      combo = 0;
      hensachi = 25;
      playerHp = 3;
      enemyMaxHp = 10;
      enemyHp = 10;
      
      setGameState('playing');
      startNextQuestion();
    }

    function startNextQuestion(queue = questionQueue, index = currentQIndex) {
      isAnswering = false;
      selectedAnswer = null;
      isCorrect = null;
      timeLeft = 10.0;
      damageAnim = false;
      shakeAnim = false;

      if (index >= queue.length) {
        questionQueue = shuffleArray(ALL_QUESTIONS);
        currentQIndex = 0;
        setupSortQuestion(questionQueue[0]);
      } else {
        setupSortQuestion(queue[index]);
      }
      
      renderApp();
      startTimer();
    }

    function setupSortQuestion(q) {
      if (q.type === 'sort') {
        selectedWords = [];
        availableWords = shuffleArray(q.words.map((w, i) => ({ id: i, text: w })));
      }
    }

    // --- タイマー処理 ---
    function startTimer() {
      stopTimer();
      timerRef = setInterval(() => {
        if (isAnswering) {
          stopTimer();
          return;
        }
        timeLeft -= 0.1;
        if (timeLeft <= 0.1) {
          timeLeft = 0;
          stopTimer();
          handleTimeout();
        }
        updateTimerUI();
      }, 100);
    }

    function stopTimer() {
      if (timerRef) {
        clearInterval(timerRef);
        timerRef = null;
      }
    }

    function updateTimerUI() {
      const bar = document.getElementById('timer-bar');
      if (bar) {
        bar.style.width = `${(timeLeft / 10) * 100}%`;
        bar.className = `h-full transition-all duration-100 ease-linear ${timeLeft > 5 ? 'bg-cyan-400' : timeLeft > 2 ? 'bg-yellow-400' : 'bg-rose-500'}`;
      }
    }

    // --- 解答処理 ---
    function handleTimeout() {
      isAnswering = true;
      isCorrect = false;
      combo = 0;
      shakeAnim = true;
      
      playerHp--;
      renderApp();

      setTimeout(() => {
        if (playerHp <= 0) {
          setGameState('gameover');
        } else {
          proceedToNext(false);
        }
      }, 1500);
    }

    window.handleChoice = function(index) {
      if (isAnswering) return;
      isAnswering = true;
      selectedAnswer = index;

      const q = questionQueue[currentQIndex];
      const isAnsCorrect = (index === q.a);
      processAnswer(isAnsCorrect, false);
    };

    window.handleWordSelect = function(id) {
      if (isAnswering) return;
      const word = availableWords.find(w => w.id === id);
      availableWords = availableWords.filter(w => w.id !== id);
      selectedWords.push(word);
      renderApp();
      
      const q = questionQueue[currentQIndex];
      if (q && q.type === 'sort' && selectedWords.length === q.a.length) {
        handleSortSubmit();
      }
    };

    window.handleWordDeselect = function(id) {
      if (isAnswering) return;
      const word = selectedWords.find(w => w.id === id);
      selectedWords = selectedWords.filter(w => w.id !== id);
      availableWords.push(word);
      renderApp();
    };

    function handleSortSubmit() {
      if (isAnswering) return;
      isAnswering = true;
      
      const q = questionQueue[currentQIndex];
      const isAnsCorrect = selectedWords.map(w => w.text).join(' ') === q.a.join(' ');

      processAnswer(isAnsCorrect, true);
    }

    function processAnswer(isAnsCorrect, isSort) {
      if (isAnsCorrect) {
        isCorrect = true;
        combo++;
        const points = isSort ? 150 : 100;
        score += points + Math.floor(timeLeft * 10) + (combo * 10);
        stageCorrect++;
        totalCorrect++;
        damageAnim = true;
        enemyHp--;
        
        renderApp();
        setTimeout(() => proceedToNext(true), isSort ? 2000 : 1200);
      } else {
        isCorrect = false;
        combo = 0;
        shakeAnim = true;
        playerHp--;
        
        renderApp();
        setTimeout(() => {
          if (playerHp <= 0) {
            setGameState('gameover');
          } else {
            proceedToNext(false);
          }
        }, isSort ? 2000 : 1200);
      }
    }

    function proceedToNext(wasCorrect) {
      if (wasCorrect && totalCorrect === 50) {
        hensachi = 75;
        setGameState('milestone');
        return;
      }
      if (wasCorrect && totalCorrect === 40) {
        hensachi = 65;
        setGameState('milestone');
        return;
      }

      if (wasCorrect && enemyHp <= 0) {
        hensachi = Math.min(hensachi + 10, 75);
        setGameState('stageClear');
        return;
      }

      currentQIndex++;
      startNextQuestion(questionQueue, currentQIndex);
    }

    window.nextStage = function() {
      stageCorrect = 0;
      enemyMaxHp = 10;
      enemyHp = 10;
      playerHp = Math.min(playerHp + 1, 3);
      currentQIndex++;
      setGameState('playing');
      startNextQuestion(questionQueue, currentQIndex);
    };

    window.continueGameFromMilestone = function() {
      if (totalCorrect === 50) {
        initGame();
      } else {
        stageCorrect = 0;
        currentQIndex++;
        setGameState('playing');
        startNextQuestion(questionQueue, currentQIndex);
      }
    };

    // === レンダリング関数 ===
    function renderApp() {
      const app = document.getElementById('app');
      
      if (gameState === 'title') {
        app.innerHTML = renderTitleHTML();
      } else if (gameState === 'playing') {
        app.innerHTML = renderPlayingHTML();
      } else if (gameState === 'stageClear') {
        app.innerHTML = renderStageClearHTML();
      } else if (gameState === 'milestone') {
        app.innerHTML = renderMilestoneHTML();
      } else if (gameState === 'gameover') {
        app.innerHTML = renderGameoverHTML();
      }

      // Lucideアイコンの再描画
      if(window.lucide) {
          lucide.createIcons();
      }
    }

    function renderTitleHTML() {
      return `
        <div class="flex flex-col items-center justify-center h-full bg-slate-900 text-white p-4 relative overflow-hidden">
          <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-indigo-900 via-slate-900 to-black opacity-80"></div>
          
          <div class="z-10 text-center animate-bounce-slow flex flex-col items-center justify-center h-full">
            <i data-lucide="trophy" class="w-16 h-16 mx-auto text-yellow-400 mb-4 drop-shadow-[0_0_15px_rgba(250,204,21,0.6)]"></i>
            <h1 class="text-4xl md:text-5xl font-extrabold mb-2 tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 drop-shadow-[0_0_10px_rgba(34,211,238,0.8)]">
              英大決戦！<br/><span class="text-2xl md:text-3xl text-white">偏差値サバイバル</span>
            </h1>
            <p class="text-lg text-slate-300 mb-4 font-bold">10秒以内に解いて、志望校の壁を打ち破れ！</p>
            
            <div class="bg-slate-800/80 p-4 rounded-xl border border-slate-700 mb-6 max-w-md mx-auto shadow-xl">
              <ul class="text-left space-y-2 text-slate-300 font-medium text-sm md:text-base">
                <li class="flex items-center"><i data-lucide="zap" class="w-4 h-4 mr-2 text-yellow-400"></i> 各問題の制限時間は10秒！</li>
                <li class="flex items-center"><i data-lucide="arrow-right" class="w-4 h-4 mr-2 text-green-400"></i> 10問正解ごとに偏差値UP！</li>
                <li class="flex items-center"><i data-lucide="heart" class="w-4 h-4 mr-2 text-rose-400"></i> 3回間違えるとゲームオーバー！</li>
                <li class="flex items-center"><i data-lucide="flag" class="w-4 h-4 mr-2 text-blue-400"></i> 40問正解で 第二志望 合格！</li>
                <li class="flex items-center"><i data-lucide="trophy" class="w-4 h-4 mr-2 text-rose-400"></i> 50問正解で 第一志望 合格！</li>
              </ul>
            </div>

            <button 
              onclick="initGame()"
              class="group relative px-8 py-3 font-bold text-xl text-white rounded-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 transform hover:scale-105 transition-all duration-200 shadow-[0_0_20px_rgba(16,185,129,0.5)]"
            >
              <span class="flex items-center">
                GAME START <i data-lucide="chevron-right" class="ml-2 group-hover:translate-x-1 transition-transform"></i>
              </span>
            </button>
          </div>
        </div>
      `;
    }

    function renderPlayingHTML() {
      const q = questionQueue[currentQIndex];
      if (!q) return '';

      const timerColor = timeLeft > 5 ? 'bg-cyan-400' : timeLeft > 2 ? 'bg-yellow-400' : 'bg-rose-500';
      const timerWidth = `${(timeLeft / 10) * 100}%`;
      const enemyInfo = getEnemyInfo();

      let heartsHtml = '';
      for (let i = 0; i < 3; i++) {
        const colorClass = i < playerHp ? 'text-rose-500 fill-rose-500' : 'text-slate-600';
        heartsHtml += `<i data-lucide="heart" class="w-5 h-5 ${colorClass} transition-all"></i>`;
      }

      let qText = q.q.replace(/\n/g, '<br/>');

      // 選択肢 または 並べ替えUIの生成
      let choicesOrSortHtml = '';
      if (q.type === 'choice' || q.type === 'error') {
        choicesOrSortHtml += '<div class="grid grid-cols-1 md:grid-cols-2 gap-2">';
        q.c.forEach((choice, idx) => {
          let btnStyle = "bg-slate-700 hover:bg-slate-600 border-slate-500 text-white";
          if (isAnswering) {
            if (idx === q.a) btnStyle = "bg-emerald-600 border-emerald-400 text-white shadow-[0_0_15px_rgba(16,185,129,0.5)]";
            else if (idx === selectedAnswer) btnStyle = "bg-rose-600 border-rose-400 text-white";
            else btnStyle = "bg-slate-800 border-slate-700 text-slate-500 opacity-50";
          }
          choicesOrSortHtml += `<button onclick="handleChoice(${idx})" ${isAnswering ? 'disabled' : ''} class="p-3 rounded-xl border-2 text-left font-bold transition-all duration-200 transform ${!isAnswering ? 'active:scale-95' : ''} ${btnStyle} text-sm md:text-base leading-tight">${choice}</button>`;
        });
        choicesOrSortHtml += '</div>';
      } else {
        let selectedHtml = selectedWords.length === 0 && !isAnswering 
          ? '<span class="text-slate-500 text-xs italic">単語をタップして並べる</span>' : '';
        selectedWords.forEach(w => {
          const style = isAnswering ? (isCorrect ? 'bg-emerald-600 text-white' : 'bg-rose-600 text-white') : 'bg-cyan-600 hover:bg-cyan-500 text-white active:scale-95';
          selectedHtml += `<button onclick="handleWordDeselect(${w.id})" ${isAnswering ? 'disabled' : ''} class="px-3 py-1.5 rounded-lg font-bold text-xs shadow-sm transition-transform ${style}">${w.text}</button>`;
        });

        let poolHtml = '';
        availableWords.forEach(w => {
          poolHtml += `<button onclick="handleWordSelect(${w.id})" ${isAnswering ? 'disabled' : ''} class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 border border-slate-600 rounded-lg text-white font-bold text-xs shadow-sm transition-transform active:scale-95">${w.text}</button>`;
        });

        choicesOrSortHtml = `
          <div class="flex flex-col gap-2">
            <div class="min-h-[48px] p-2 bg-slate-900 border-2 border-dashed border-cyan-500/50 rounded-xl flex flex-wrap gap-1.5 items-center">
              ${selectedHtml}
            </div>
            <div class="p-2 bg-slate-800 rounded-xl flex flex-wrap gap-1.5 justify-center">
              ${poolHtml}
            </div>
          </div>
        `;
      }

      // 解説
      let explHtml = '';
      if (isAnswering && !isCorrect) {
        if (q.type !== 'sort') {
          const explText = q.expl ? `(${q.expl})` : '';
          explHtml = `<div class="mt-2 p-2 bg-rose-500/20 border border-rose-500/50 rounded-lg text-rose-300 font-bold text-xs md:text-sm">正解: ${q.c[q.a]} ${explText}</div>`;
        } else {
          explHtml = `<div class="mt-2 p-2 bg-rose-500/20 border border-rose-500/50 rounded-lg text-rose-300 font-bold text-xs md:text-sm">正解: ${q.a.join(' ')}</div>`;
        }
      }

      // 正誤フィードバック
      let feedbackOverlay = '';
      if (isAnswering) {
        if (isCorrect) {
          feedbackOverlay = `
            <div class="absolute inset-0 flex items-center justify-center z-20 pointer-events-none">
              <div class="text-emerald-400 animate-bounce">
                <i data-lucide="check-circle" class="w-24 h-24 bg-slate-900 rounded-full"></i>
              </div>
            </div>
          `;
        } else {
          feedbackOverlay = `
            <div class="absolute inset-0 flex items-center justify-center z-20 pointer-events-none">
              <div class="text-rose-500 animate-[scale-up_0.2s_ease-out]">
                <i data-lucide="x-circle" class="w-24 h-24 bg-slate-900 rounded-full"></i>
              </div>
            </div>
          `;
        }
      }

      return `
        <div class="flex flex-col h-full bg-slate-900 text-slate-100 font-sans">
          <header class="flex justify-between items-end p-2 px-4 bg-slate-800 border-b border-slate-700 shadow-md shrink-0">
            <div>
              <div class="text-[10px] text-slate-400 font-bold tracking-widest mb-0.5">LEVEL</div>
              <div class="text-xl md:text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-orange-500 drop-shadow-[0_0_5px_rgba(250,204,21,0.5)] leading-none">
                偏差値 ${hensachi}
              </div>
            </div>
            <div class="flex flex-col items-end relative">
              <div class="flex items-center gap-1 mb-1">
                ${heartsHtml}
              </div>
              <div class="text-xs font-bold text-slate-400">SCORE: ${score}</div>
              <div class="text-xs md:text-sm font-bold text-emerald-400 flex items-center justify-end">
                <i data-lucide="star" class="w-3 h-3 mr-1 fill-current"></i>
                CLEARまで: あと ${enemyHp}問
              </div>
              ${combo > 1 ? `<div class="text-rose-400 font-black animate-pulse text-xs absolute top-1 right-[110%] w-max">${combo} COMBO!</div>` : ''}
            </div>
          </header>

          <div class="h-2 w-full bg-slate-800 shrink-0">
            <div id="timer-bar" class="h-full transition-all duration-100 ease-linear ${timerColor}" style="width: ${timerWidth}"></div>
          </div>

          <div class="flex-1 flex flex-col p-2 md:p-4 max-w-3xl mx-auto w-full overflow-y-auto ${shakeAnim ? 'animate-[shake_0.5s_ease-in-out]' : ''}">
            
            <div class="flex shrink-0 flex-col items-center justify-center py-2 relative">
               <div class="text-cyan-400 font-bold mb-1 flex flex-col items-center w-full max-w-[200px]">
                 <span class="text-xs tracking-wider">${enemyInfo.name}</span>
                 <div class="w-full h-2 bg-slate-700 rounded-full mt-1 border border-slate-600 overflow-hidden">
                   <div class="h-full bg-gradient-to-r from-rose-500 to-orange-500 transition-all duration-300" style="width: ${(enemyHp / enemyMaxHp) * 100}%"></div>
                 </div>
               </div>
               <div class="relative transition-transform duration-200 mt-1 ${damageAnim ? 'scale-90 opacity-80 mix-blend-screen' : 'scale-100'} ${timeLeft < 3 && !isAnswering ? 'animate-pulse' : ''}">
                  <div class="w-20 h-20 md:w-24 md:h-24 rounded-full bg-slate-800 border-4 border-slate-600 flex items-center justify-center shadow-[0_0_20px_rgba(0,0,0,0.5)] relative overflow-hidden">
                     <div class="text-4xl md:text-5xl">${enemyInfo.icon}</div>
                     ${damageAnim ? '<div class="absolute inset-0 bg-white opacity-50 animate-ping rounded-full"></div>' : ''}
                  </div>
                  ${damageAnim ? '<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-rose-500 font-black text-4xl animate-[ping_0.3s_ease-out]">💥</div>' : ''}
               </div>
               ${feedbackOverlay}
            </div>

            <div class="bg-slate-800 p-3 md:p-4 rounded-xl shadow-lg border border-slate-600 mb-3 relative shrink-0">
              ${q.type === 'error' ? '<div class="text-rose-400 font-bold text-xs mb-1">【誤り指摘】</div>' : ''}
              ${q.type === 'sort' ? '<div class="text-cyan-400 font-bold text-xs mb-1">【並べ替え】</div>' : ''}
              <div class="text-base md:text-lg font-medium leading-relaxed whitespace-pre-wrap">${qText}</div>
              ${explHtml}
            </div>

            <div class="mt-auto pb-2 shrink-0">
              ${choicesOrSortHtml}
            </div>
          </div>
        </div>
      `;
    }

    function renderStageClearHTML() {
      return `
        <div class="flex flex-col items-center justify-center h-full bg-slate-900 text-white p-4 relative overflow-hidden">
          ${generateConfetti()}
          <div class="z-10 text-center bg-slate-800/90 p-6 md:p-8 rounded-3xl border-4 border-yellow-500 shadow-[0_0_40px_rgba(234,179,8,0.4)] animate-[pop-in_0.5s_ease-out]">
            <h2 class="text-3xl md:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-600 mb-2">STAGE CLEAR!</h2>
            <p class="text-emerald-400 font-bold mb-4">10問突破！実力が上がった！</p>
            <p class="text-rose-400 font-bold mb-4 flex items-center justify-center gap-2 text-sm">
              <i data-lucide="heart" class="w-4 h-4 fill-rose-400"></i> ライフが1回復した！
            </p>
            
            <div class="flex items-center justify-center gap-4 mb-6">
              <div class="text-slate-400 text-xl font-bold line-through">偏差値 ${hensachi - 10}</div>
              <i data-lucide="arrow-right" class="w-6 h-6 text-yellow-400 animate-pulse"></i>
              <div class="text-4xl font-black text-cyan-400 drop-shadow-[0_0_10px_rgba(34,211,238,0.8)]">偏差値 ${hensachi}</div>
            </div>

            <p class="text-base text-slate-300 mb-6 italic">「${getHensachiMessage()}」</p>

            <button 
              onclick="nextStage()"
              class="px-8 py-3 font-bold text-lg text-white rounded-full bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-400 hover:to-indigo-500 transform hover:scale-105 transition-all shadow-[0_0_20px_rgba(59,130,246,0.5)]"
            >
              次のステージへ挑む
            </button>
          </div>
        </div>
      `;
    }

    function renderMilestoneHTML() {
      const isFirstChoice = totalCorrect === 50;
      const title = isFirstChoice ? "第一志望 合格！！" : "第二志望 合格！！";
      const subTitle = isFirstChoice ? "おめでとう！君は最高の努力をした！" : "素晴らしい！滑り止めは確保したぞ！";
      const colorFrom = isFirstChoice ? "from-yellow-400" : "from-emerald-400";
      const colorTo = isFirstChoice ? "to-orange-600" : "to-teal-600";
      const shadowColor = isFirstChoice ? "rgba(250,204,21,0.6)" : "rgba(16,185,129,0.6)";

      return `
        <div class="flex flex-col items-center justify-center h-full bg-slate-900 text-white p-4 relative overflow-hidden">
          ${generateConfetti()}
          <div class="absolute inset-0 bg-gradient-to-t ${isFirstChoice ? 'from-orange-900/50' : 'from-teal-900/50'} to-transparent"></div>
          
          <div class="z-10 text-center max-w-2xl w-full">
            <i data-lucide="trophy" class="w-24 h-24 mx-auto mb-4 ${isFirstChoice ? 'text-yellow-400' : 'text-emerald-400'} drop-shadow-[0_0_20px_${shadowColor}] animate-bounce"></i>
            
            <h2 class="text-4xl md:text-6xl font-black mb-3 text-transparent bg-clip-text bg-gradient-to-r ${colorFrom} ${colorTo} drop-shadow-[0_0_15px_${shadowColor}]">
              ${title}
            </h2>
            <p class="text-lg md:text-xl font-bold text-white mb-6">${subTitle}</p>
            
            <div class="bg-slate-800/80 p-4 md:p-6 rounded-2xl border border-slate-600 mb-8 shadow-2xl backdrop-blur-sm">
              <div class="text-xs text-slate-400 mb-1">最終到達レベル</div>
              <div class="text-5xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r ${colorFrom} ${colorTo}">
                偏差値 ${hensachi}
              </div>
              <div class="mt-3 text-slate-300 font-medium text-base md:text-lg">
                正解数: ${totalCorrect}問 / スコア: ${score}
              </div>
            </div>

            <button 
              onclick="continueGameFromMilestone()"
              class="px-8 py-3 font-bold text-lg text-white rounded-full bg-gradient-to-r ${colorFrom} ${colorTo} transform hover:scale-105 transition-all shadow-[0_0_20px_${shadowColor}]"
            >
              ${isFirstChoice ? "タイトルに戻る" : "第一志望を目指して続ける！"}
            </button>
          </div>
        </div>
      `;
    }

    function renderGameoverHTML() {
      return `
        <div class="flex flex-col items-center justify-center h-full bg-slate-900 text-white p-4 relative overflow-hidden">
          <div class="absolute inset-0 bg-gradient-to-b from-rose-900/40 to-black"></div>
          
          <div class="z-10 text-center bg-slate-800/80 p-6 md:p-8 rounded-3xl border border-slate-700 shadow-2xl max-w-lg w-full backdrop-blur-sm">
            <i data-lucide="shield-alert" class="w-20 h-20 mx-auto text-rose-500 mb-4 animate-pulse drop-shadow-[0_0_15px_rgba(244,63,94,0.5)]"></i>
            <h2 class="text-3xl md:text-4xl font-black text-rose-500 mb-2">GAME OVER</h2>
            <p class="text-slate-300 font-bold mb-6 text-sm md:text-base">ライフが尽きてしまった...</p>
            
            <div class="bg-slate-900/50 p-4 md:p-6 rounded-xl mb-6">
              <div class="text-xs text-slate-400 mb-1">最終到達レベル</div>
              <div class="text-4xl md:text-5xl font-black text-white mb-3">偏差値 ${hensachi}</div>
              <div class="flex justify-between text-slate-300 font-medium mt-3 text-sm md:text-base">
                <span>正解数: ${totalCorrect}問</span>
                <span>スコア: ${score}</span>
              </div>
            </div>

            <button 
              onclick="initGame()"
              class="w-full px-6 py-3 font-bold text-lg text-white rounded-xl bg-slate-700 hover:bg-slate-600 transition-colors shadow-lg flex items-center justify-center gap-2"
            >
              タイトルに戻る
            </button>
          </div>
        </div>
      `;
    }

    // 初回描画
    renderApp();

  </script>
</body>
</html>
